[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "render-pptx"
version = "0.1.0"
description = "Render PowerPoint slides as PNG images using python-pptx and Pillow"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["python-pptx>=0.6.21", "Pillow>=10.1"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
render-pptx = "render_pptx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
